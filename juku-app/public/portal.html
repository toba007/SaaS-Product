<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuBo School</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">LuBo School<span>塾運営支援システム</span></div>
      <p class="muted small" style="margin:18px 0 14px">ご利用の区分を選択してください。</p>
      <div class="demo-btns">
        <a class="btn primary" href="/staff" style="justify-content:flex-start;padding:12px 15px">講師・管理者用（管理画面）</a>
        <a class="btn" href="/family" style="justify-content:flex-start;padding:12px 15px">生徒・保護者用</a>
      </div>
      <p class="muted small" style="margin-top:18px;line-height:1.7">
        2つの区分はそれぞれ別のログインとして扱われます。1台の端末でも、別々のウィンドウで「講師用」と「生徒・保護者用」を<b>同時に</b>開けます（ログインが混ざりません）。
      </p>
    </div>
  </div>
</body>
</html>
